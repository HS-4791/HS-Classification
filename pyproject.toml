[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hsclass"
version = "0.1.0"
description = "HS tariff classification with a deterministic GRI rule engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
    "pdfplumber>=0.11",
    "httpx>=0.28",
    # hsclass.retrieval.index imports numpy unconditionally, so it is a core
    # dependency rather than part of the optional retrieval stack.
    "numpy>=1.26",
]

[project.optional-dependencies]
# fastembed runs BGE through ONNX Runtime: no PyTorch, which this machine's
# Application Control policy refuses to load. Search is exact numpy, no faiss.
retrieval = ["fastembed>=0.5"]
data = ["datasets>=3.2", "pandas>=2.2"]
llm = ["anthropic>=0.69"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
hsclass = "hsclass.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hsclass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["hsclass"]
ignore_missing_imports = true
