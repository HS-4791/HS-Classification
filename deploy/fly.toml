# Fly.io. The service holds the rulings, the provision text and an inverted
# index: about 250 MB resident when measured locally, so 1 GB is headroom
# rather than a requirement.
app = "hsclass"
primary_region = "lhr"

[build]
  dockerfile = "../Dockerfile"

[env]
  HTS_REVISION = "2026HTSRev21"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Zero is deliberate: a cold start is about a second because nothing is
  # downloaded at boot, so there is no reason to pay for an idle machine.
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
