name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  HTS_REVISION: 2026HTSRev21

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q

  schedule:
    # The tree is rebuilt from the pinned release and must reconcile against
    # the committed manifest. A schedule that drifts fails here rather than
    # silently producing codes against the wrong version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Fetch the pinned release
        run: python scripts/fetch_schedule.py --revision "$HTS_REVISION" --verify
      - name: Validate the tree
        run: hsclass schedule validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tree-validation
          path: reports/tree-validation.json

  regression:
    # Once a baseline is committed, accuracy may not fall below it.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/check_regression.py
